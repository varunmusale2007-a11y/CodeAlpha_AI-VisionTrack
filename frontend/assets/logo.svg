<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Tech Ring -->
  <circle cx="50" cy="50" r="44" fill="#0b0f19" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.9" />
  <circle cx="50" cy="50" r="36" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Optical Aperture / AI Vision Eye -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="#111827" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="14" fill="#030712" stroke="url(#neonGlow)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="6" fill="#00f2fe" filter="url(#glow)" />
  
  <!-- Corner Reticle Markers -->
  <path d="M 22 30 L 22 22 L 30 22" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 78 30 L 78 22 L 70 22" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 22 70 L 22 78 L 30 78" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 78 70 L 78 78 L 70 78" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Target Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="80" x2="50" y2="88" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="50" x2="20" y2="50" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="50" x2="88" y2="50" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
</svg>
